[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "visionevidence-agent"
version = "0.1.0"
description = "Lightweight multimodal evidence-grounded verification research scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5", "Pillow==11.3.0"]

[project.scripts]
visionevidence = "visionevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
